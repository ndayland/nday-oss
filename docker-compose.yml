# Local development database only. Credentials here are dev-only defaults.
services:
  db:
    image: postgres:16
    # `go test ./...` runs many packages in parallel, each test with its own
    # schema and connections; the default of 100 is reached now and then
    # ("too many clients already", SQLSTATE 53300).
    command: ["postgres", "-c", "max_connections=300"]
    environment:
      POSTGRES_USER: nday
      POSTGRES_PASSWORD: nday
      POSTGRES_DB: nday
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - nday_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nday -d nday"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  nday_pgdata:
